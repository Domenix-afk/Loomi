[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loomi"
version = "0.1.0"
description = "Modularer Grundbaustein für Loomis Personal-Style-Engine: Outfit-Generierung, regelbasiertes Scoring und Empfehlung."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["loomi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
